---
# Create one monitoring clone for the selected AAP allocation on its own hypervisor.
# Keep inherited polling/actions stopped until the clone API has been quarantined.
# Publish only its versioned HTTPS/Basic-auth frontend and target-local monitoring.
- name: Deploy the selected versioned Zabbix monitoring clone
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load the selected instance's protected monitoring settings before connecting
      ansible.builtin.include_tasks: tasks/demo_runtime_settings.yml
      vars:
        demo_runtime_expected_instance: "{{ demo_zabbix_deployment.instance_name }}"

    - name: Require the selected deployment and its protected launch handoff
      ansible.builtin.assert:
        that:
          - demo_zabbix_deployment is defined
          - demo_zabbix_clone_api_token is defined
          - demo_zabbix_dns_api_token is defined
          - demo_zabbix_basic_auth_file is defined
          - demo_zabbix_event_stream is defined
        fail_msg: >-
          Supply the selected deployment plus clone API token, DNS token, htpasswd
          contents and target Event Stream URL/Basic credentials as documented.
        quiet: true

    - name: Validate allocation, saved image and exact management identity locally
      ansible.builtin.set_fact:
        demo_zabbix_config: "{{ demo_zabbix_deployment | demo_zabbix_configuration }}"
      no_log: true

    - name: Validate the explicitly selected target event stream
      ansible.builtin.set_fact:
        demo_zabbix_delivery: "{{ demo_zabbix_config | demo_zabbix_event_stream(demo_zabbix_event_stream) }}"
      no_log: true

    - name: Require explicit protected clone credentials and a single selected hypervisor
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_host == demo_zabbix_config.hypervisor.address
          - demo_zabbix_clone_api_token is defined
          - demo_zabbix_clone_api_token | string | length > 20
          - demo_zabbix_dns_api_token is defined
          - demo_zabbix_dns_api_token | length > 0
          - demo_zabbix_basic_auth_file is defined
          - demo_zabbix_basic_auth_file | trim | length > 0
          - demo_zabbix_deployment.isolation_policy is mapping
          - demo_zabbix_enable_delivery | default(false) is boolean
          - demo_zabbix_enable_testserver_monitoring | default(false) is boolean
        quiet: true
        fail_msg: Supply the selected target and explicit Vault-protected clone, DNS and frontend credentials.
      no_log: true

    - name: Allocate a job-local file for verified hypervisor and guest SSH public keys
      ansible.builtin.tempfile:
        state: file
        prefix: demo-zabbix-known-hosts-
      delegate_to: localhost
      become: false
      register: demo_zabbix_known_hosts
      check_mode: false

    - name: Write only the selected hypervisor public SSH keys
      ansible.builtin.copy:
        dest: "{{ demo_zabbix_known_hosts.path }}"
        content: |
          {% for key in demo_zabbix_config.hypervisor.host_keys %}
          {{ demo_zabbix_config.hypervisor.address }} {{ key }}
          [{{ demo_zabbix_config.hypervisor.address }}]:{{ demo_zabbix_config.hypervisor.port }} {{ key }}
          {% endfor %}
        mode: '0600'
      delegate_to: localhost
      become: false
      check_mode: false
      no_log: true

    - name: Enforce the selected non-root hypervisor connection
      ansible.builtin.set_fact:
        ansible_user: "{{ demo_zabbix_config.hypervisor.user }}"
        ansible_port: "{{ demo_zabbix_config.hypervisor.port }}"
        ansible_password: ''
        ansible_become_password: ''
        ansible_host_key_checking: true
        ansible_ssh_host_key_checking: true
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ demo_zabbix_known_hosts.path | quote }}
          -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
      no_log: true

    - name: Check actual hypervisor identity before any image or service changes
      ansible.builtin.command:
        argv: [cat, /etc/machine-id]
      register: demo_zabbix_live_hypervisor
      changed_when: false
      check_mode: false
      failed_when: demo_zabbix_live_hypervisor.stdout | trim != demo_zabbix_config.hypervisor.machine_id
      no_log: true

    - name: Validate the complete existing isolation policy without changing it
      ansible.builtin.command:
        argv: [/usr/local/sbin/hactar-recovery-isolation, check]
        stdin: "{{ demo_zabbix_deployment.isolation_policy | to_json }}"
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require active and persistent isolation
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", hactar-recovery-isolation.service]
      loop: [is-active, is-enabled]
      changed_when: false
      check_mode: false
      no_log: true

    - name: Inspect only the declared isolated guest network
      ansible.builtin.command:
        argv: [virsh, -c, 'qemu:///system', net-dumpxml, "{{ demo_zabbix_config.vm_network }}"]
      register: demo_zabbix_network_xml
      changed_when: false
      check_mode: false
      no_log: true

    - name: Bind the monitoring guest to the existing isolation bridge
      ansible.builtin.set_fact:
        demo_zabbix_network: >-
          {{ demo_zabbix_network_xml.stdout | demo_zabbix_network_details(demo_zabbix_config.vm_network) }}
      no_log: true

    - name: Refuse a network outside the existing isolation policy
      ansible.builtin.assert:
        that: demo_zabbix_network.bridge in demo_zabbix_deployment.isolation_policy.bridges
        quiet: true
      no_log: true

    - name: Inspect existing domain names without changing them
      ansible.builtin.command:
        argv: [virsh, -c, 'qemu:///system', list, --all, --name]
      register: demo_zabbix_domain_names
      changed_when: false
      check_mode: false
      no_log: true

    - name: Verify the selected testserver identity before allowing its monitoring
      when: demo_zabbix_enable_testserver_monitoring | default(false) | bool
      no_log: true
      block:
        - name: Read the selected testserver persistent domain
          ansible.builtin.command:
            argv: [virsh, -c, 'qemu:///system', dumpxml, --inactive, "{{ demo_zabbix_config.testserver.vm_name }}"]
          register: demo_zabbix_testserver_domain_xml
          changed_when: false
          check_mode: false

        - name: Require the verified testserver UUID, disk, MAC and network
          ansible.builtin.assert:
            that: demo_zabbix_config | demo_zabbix_testserver_domain(demo_zabbix_testserver_domain_xml.stdout)
            quiet: true

        - name: Read only the selected testserver assigned lease
          ansible.builtin.command:
            argv: [virsh, -c, 'qemu:///system', domifaddr, "{{ demo_zabbix_config.testserver.vm_name }}", --source, lease]
          register: demo_zabbix_testserver_lease
          changed_when: false
          check_mode: false

        - name: Require its actual assigned address to match the verified artifact
          ansible.builtin.assert:
            that: >-
              demo_zabbix_testserver_lease.stdout | demo_zabbix_guest_address(demo_zabbix_config.testserver.mac)
              == demo_zabbix_config.testserver.address
            quiet: true

    - name: Stop check mode before cloning or configuring the monitoring guest
      ansible.builtin.meta: end_play
      when: ansible_check_mode

  tasks:
    - name: Create or verify only this allocation's monitoring guest
      ansible.builtin.include_tasks: tasks/demo_zabbix_vm.yml

    - name: Prepare this guest's isolated management connection
      ansible.builtin.include_tasks: tasks/demo_zabbix_guest_connection.yml

    - name: Verify the selected agent before interrupting existing monitoring
      ansible.builtin.include_tasks: tasks/demo_zabbix_testserver_readiness.yml
      args:
        apply:
          delegate_to: "{{ demo_zabbix_config.hostname }}"
          become: true
          no_log: true
      when: demo_zabbix_enable_testserver_monitoring | default(false) | bool

    - name: Quarantine the copied integrations and configure target-local monitoring
      ansible.builtin.include_tasks: tasks/demo_zabbix_monitoring.yml
      args:
        apply:
          delegate_to: "{{ demo_zabbix_config.hostname }}"
          become: true
          no_log: true

    - name: Publish this version's DNS, trusted certificate and protected reverse proxy
      ansible.builtin.include_tasks: tasks/demo_zabbix_frontend.yml

    - name: Validate all target settings and finish only the selected forwarding action
      ansible.builtin.include_tasks: tasks/demo_zabbix_finalize.yml
      args:
        apply:
          delegate_to: "{{ demo_zabbix_config.hostname }}"
          become: true
          no_log: true

    - name: Publish verified monitoring provenance for the owning use case and existing source inventory
      ansible.builtin.set_stats:
        data:
          demo_zabbix_instance: >-
            {{ demo_zabbix_config | demo_zabbix_provenance(
                 demo_zabbix_guest_record, demo_zabbix_guest_ip, demo_zabbix_network,
                 demo_zabbix_guest_machine_id.stdout | trim) |
               combine({'item_id': demo_zabbix_monitoring_item_id, 'trigger_id': demo_zabbix_monitoring_trigger_id,
                        'mediatype_id': demo_zabbix_media_id, 'action_id': demo_zabbix_action_id,
                        'delivery_enabled': demo_zabbix_enable_delivery | default(false) | bool,
                        'testserver_monitoring_enabled': demo_zabbix_enable_testserver_monitoring | default(false) | bool}) }}
        aggregate: false
        per_host: false
      no_log: true

    - name: Report the configured monitoring deployment
      ansible.builtin.debug:
        msg: The selected monitoring clone is configured with target-local website monitoring and a protected HTTPS frontend.
