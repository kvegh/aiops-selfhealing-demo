---
- name: Deploy the existing read-only Zabbix MCP stdio server on the selected TRA
  hosts: all
  become: true
  gather_facts: false
  vars:
    demo_mcp_server_name: zabbix
  tasks:
    - name: Prepare and verify the selected target's Zabbix MCP configuration
      block:
        - name: Load only the selected instance's protected Zabbix MCP settings
          ansible.builtin.include_tasks: tasks/demo_runtime_settings.yml
          vars:
            demo_runtime_expected_instance: "{{ demo_mcp_deployment.instance_name }}"

        - name: Select the verified TRA before connecting
          ansible.builtin.include_tasks: tasks/demo_mcp_target.yml

        - name: Require only the selected new Zabbix API and its explicit token
          ansible.builtin.set_fact:
            demo_zabbix_mcp_config: >-
              {{ demo_mcp_deployment | demo_mcp_zabbix_configuration(demo_zabbix_mcp_api_token | default('')) }}
          no_log: true

        - name: Select the approved existing Zabbix MCP image archive
          ansible.builtin.set_fact:
            demo_mcp_image: "{{ demo_mcp_config.artifacts.images['zabbix-mcp'] }}"

        - name: Install the verified offline rootless runtime and image
          ansible.builtin.include_tasks: tasks/demo_mcp_runtime.yml

        - name: Prepare the existing server configuration location
          ansible.builtin.file:
            path: /etc/zabbix-mcp
            state: directory
            owner: root
            group: "{{ demo_mcp_user.gid }}"
            mode: '0750'
            setype: container_file_t

        - name: Configure read-only access to only the matching new Zabbix instance
          ansible.builtin.template:
            src: demo-zabbix-mcp.toml.j2
            dest: /etc/zabbix-mcp/config.toml
            owner: "{{ demo_mcp_user.name }}"
            group: "{{ demo_mcp_user.gid }}"
            mode: '0600'
            setype: container_file_t
          no_log: true
          diff: false

        - name: Preserve the existing container and stdio invocation
          ansible.builtin.set_fact:
            demo_mcp_server_definition:
              type: stdio
              command: podman
              args:
                - run
                - --rm
                - -i
                - --pull=never
                - --userns
                - keep-id:uid=999,gid=999
                - -v
                - /etc/zabbix-mcp/config.toml:/etc/zabbix-mcp/config.toml:ro
                - "{{ demo_mcp_image.name }}"
                - --config
                - /etc/zabbix-mcp/config.toml

        - name: Merge the one Zabbix MCP client entry
          ansible.builtin.include_tasks: tasks/demo_mcp_client.yml

        - name: Verify stdio initialization and an authenticated read-only host query
          ansible.builtin.script:
            cmd: >-
              {{ (playbook_dir + '/../src/verify_stdio_mcp.py') | quote }}
              --client-config {{ (demo_mcp_user.home + '/.claude.json') | quote }}
              --project {{ demo_mcp_workspace.path | quote }}
              --server zabbix
            executable: /usr/bin/python3
          become: true
          become_user: "{{ demo_mcp_user.name }}"
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ demo_mcp_user.uid }}"
          changed_when: false
          failed_when: false
          register: demo_mcp_protocol_check
          no_log: true

        - name: Require an authenticated read-only query to the new Zabbix instance
          ansible.builtin.assert:
            that: demo_mcp_protocol_check.rc == 0
            fail_msg: Zabbix MCP verification failed; inspect the protected diagnostic file on the selected TRA.
            quiet: true

      always:
        - name: Remove the execution environment's temporary public trust file
          ansible.builtin.file:
            path: "{{ demo_mcp_trust.path }}"
            state: absent
          delegate_to: localhost
          become: false
          when: demo_mcp_trust.path is defined
