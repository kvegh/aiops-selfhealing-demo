---
- name: Install and configure Zabbix agent
  hosts: all

  tasks:
    # No default on purpose — a play-level var would outrank the inventory
    # and silently shadow whatever AAP supplies.
    - name: Require the Zabbix server address
      ansible.builtin.assert:
        that:
          - zabbix_server is defined
          - zabbix_server | length > 0
        fail_msg: >-
          zabbix_server is not set. Supply it from the AAP inventory, a job
          template extra variable, or -e zabbix_server=... on the CLI.
        quiet: true

    - name: Install Zabbix repo
      ansible.builtin.dnf:
        name: https://repo.zabbix.com/zabbix/7.4/release/rhel/9/noarch/zabbix-release-latest.el9.noarch.rpm
        state: present
        disable_gpg_check: true

    - name: Install zabbix-agent2
      ansible.builtin.dnf:
        name: zabbix-agent2
        state: present

    - name: Configure Zabbix server address
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regex: ^Server=
        line: "Server={{ zabbix_server }}"
      notify: restart zabbix-agent2

    - name: Enable and start zabbix-agent2
      ansible.builtin.service:
        name: zabbix-agent2
        enabled: true
        state: started

  handlers:
    - name: restart zabbix-agent2
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
