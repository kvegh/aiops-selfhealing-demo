---
# Arms the audience button.
#
# "Armed" is server-side state, not something each browser decides. A
# marker file must exist for nginx to accept /api/panic at all; without
# it the endpoint answers 423 and every open page greys its button out
# within one poll.
#
# The website-recovery EDA rule launches this template only after Zabbix
# has observed the site healthy again. That keeps each outage closed in
# monitoring before the audience can start another cycle.
#
# The marker holds a fresh nonce each time. The page reads it and sends
# it as the request body, which also makes every webhook delivery unique
# — AAP derives its delivery GUID from a hash of the body and silently
# drops repeats, so a constant body means the button fires exactly once
# in the lifetime of the installation.

- name: Arm the demo button
  hosts: all
  become: true

  vars:
    demo_website_root: /var/www/redhat
    demo_button_marker: /var/www/redhat/.armed

  tasks:
    - name: Confirm the website is healthy before rearming
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o/dev/null
          - -w%{http_code}
          - --resolve
          - redhat.supercorp.at:443:127.0.0.1
          - https://redhat.supercorp.at/content.html
      register: demo_content_check
      changed_when: false
      failed_when: demo_content_check.stdout != "200"

    - name: Write a fresh nonce to the marker
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        dest: "{{ demo_button_marker }}"
        owner: root
        group: root
        mode: "0644"
        setype: httpd_sys_content_t

    - name: Confirm the endpoint accepts presses again
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o/dev/null
          - -w%{http_code}
          - --resolve
          - redhat.supercorp.at:443:127.0.0.1
          - https://redhat.supercorp.at/armed
      register: demo_armed_check
      changed_when: false
      failed_when: demo_armed_check.stdout != "200"

    - name: Report
      ansible.builtin.debug:
        msg: Button rearmed after monitored recovery. One press will disarm it again.
