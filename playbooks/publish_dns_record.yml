---
# Publishes a DNS A record through the GoDaddy API.
#
#   dns_record_name   fully qualified name to publish (must be sanctioned)
#   dns_record_value  address it should point at
#   dns_record_ttl    optional, defaults to 600
#
# The control is the allowlist below, not the caller. A job template that can
# run this playbook can only ever publish a name that already appears in
# dns_sanctioned_names — anything else fails before the API is touched. That
# keeps an arbitrary-DNS-write capability out of the automation estate even
# though the credential behind it could write any record in the zone.
#
# Adding a name to the list is therefore a reviewed change, not a runtime
# argument. That is the whole point.
#
# These names are not secret: every one of them is already published in
# Certificate Transparency logs by Let's Encrypt at issuance.

- name: Publish a sanctioned DNS record
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    dns_domain: "{{ vault_domain }}"
    dns_record_ttl: 600

    # The complete set of names this playbook may publish.
    dns_sanctioned_names:
      - aap.supercorp.at
      - claude.supercorp.at
      - zabbix.supercorp.at
      - aap27-test-12.supercorp.at
      - redhat.supercorp.at

  tasks:
    - name: Require a record name and value
      ansible.builtin.assert:
        that:
          - dns_record_name is defined
          - dns_record_name | length > 0
          - dns_record_value is defined
          - dns_record_value | length > 0
        fail_msg: >-
          Both dns_record_name and dns_record_value are required. Supply them
          from the job template or -e on the CLI.
        quiet: true

    - name: Refuse any name that is not sanctioned
      ansible.builtin.assert:
        that:
          - dns_record_name in dns_sanctioned_names
        fail_msg: >-
          '{{ dns_record_name }}' is not a sanctioned DNS name. Permitted:
          {{ dns_sanctioned_names | join(', ') }}. To publish something else,
          add it to dns_sanctioned_names in this playbook and have the change
          reviewed — do not pass it as an extra variable.
        quiet: true

    # Guards against a sanctioned name from a different zone being pushed into
    # this one, which would silently create a nonsense record.
    - name: Confirm the name belongs to the managed zone
      ansible.builtin.assert:
        that:
          - dns_record_name is match('^[A-Za-z0-9._-]+\.' ~ (dns_domain | regex_escape) ~ '$')
        fail_msg: "'{{ dns_record_name }}' is not inside the zone '{{ dns_domain }}'."
        quiet: true

    # GoDaddy addresses records by their host part, relative to the zone.
    - name: Derive the host part
      ansible.builtin.set_fact:
        dns_record_host: "{{ dns_record_name | regex_replace('\\.' ~ (dns_domain | regex_escape) ~ '$', '') }}"

    - name: Publish the A record
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ dns_domain }}/records/A/{{ dns_record_host }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ vault_godaddy_api_token }}"
        body_format: json
        body:
          - data: "{{ dns_record_value }}"
            ttl: "{{ dns_record_ttl | int }}"
        status_code: 200
      become: false
      no_log: true

    - name: Wait for the record to resolve
      ansible.builtin.set_fact:
        dns_resolved: "{{ lookup('community.general.dig', dns_record_name, '@8.8.8.8', errors='ignore') }}"
      retries: 30
      delay: 10
      until: dns_resolved == dns_record_value

    - name: Report
      ansible.builtin.debug:
        msg: "{{ dns_record_name }} -> {{ dns_record_value }} (TTL {{ dns_record_ttl }}), resolving."
