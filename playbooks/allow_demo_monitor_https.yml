---
# One-time access rule for the monitoring VM to check this host's HTTPS site.
# Supply the monitoring VM's IPv4 address through the AAP job template.
- name: Allow the demo monitor to reach HTTPS
  hosts: all
  become: true

  vars:
    demo_monitor_https_rule: >-
      rule family="ipv4" source address="{{ demo_monitor_source_ipv4 }}/32"
      port port="443" protocol="tcp" accept

  tasks:
    - name: Require a single IPv4 monitoring source
      ansible.builtin.assert:
        that:
          - demo_monitor_source_ipv4 is defined
          - demo_monitor_source_ipv4 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
        fail_msg: Supply demo_monitor_source_ipv4 as the monitoring VM's IPv4 address.
        quiet: true

    - name: Check the permanent firewall rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - "--query-rich-rule={{ demo_monitor_https_rule }}"
      register: demo_monitor_permanent_rule
      changed_when: false
      failed_when: demo_monitor_permanent_rule.rc not in [0, 1]

    - name: Preserve the access rule across restarts
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - "--add-rich-rule={{ demo_monitor_https_rule }}"
      when: demo_monitor_permanent_rule.rc == 1
      changed_when: true

    - name: Check the active firewall rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone=libvirt
          - "--query-rich-rule={{ demo_monitor_https_rule }}"
      register: demo_monitor_active_rule
      changed_when: false
      failed_when: demo_monitor_active_rule.rc not in [0, 1]

    - name: Allow the monitoring VM now
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone=libvirt
          - "--add-rich-rule={{ demo_monitor_https_rule }}"
      when: demo_monitor_active_rule.rc == 1
      changed_when: true

    - name: Verify the permanent rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - "--query-rich-rule={{ demo_monitor_https_rule }}"
      changed_when: false

    - name: Verify the active rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone=libvirt
          - "--query-rich-rule={{ demo_monitor_https_rule }}"
      changed_when: false
