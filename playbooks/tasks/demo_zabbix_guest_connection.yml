---
- name: Append only the generated and retained guest public SSH keys
  ansible.builtin.blockinfile:
    path: "{{ demo_zabbix_known_hosts.path }}"
    marker: '# {mark} selected monitoring guest'
    block: |
      {% for key in demo_zabbix_guest_record.guest_host_keys %}
      {{ demo_zabbix_config.hostname }} {{ key }}
      {% endfor %}
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true

- name: Add only the owned monitoring guest through its pinned hypervisor
  ansible.builtin.add_host:
    name: "{{ demo_zabbix_config.hostname }}"
    ansible_host: "{{ demo_zabbix_guest_ip }}"
    ansible_user: "{{ demo_zabbix_config.guest_user }}"
    ansible_port: 22
    ansible_connection: ssh
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_password: ''
    ansible_become_password: ''
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes
      -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
      -o UserKnownHostsFile={{ demo_zabbix_known_hosts.path | quote }}
      -o HostKeyAlias={{ demo_zabbix_config.hostname | quote }}
      -o ProxyCommand={{ ('ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=' +
          (demo_zabbix_known_hosts.path | quote) +
          ' -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -p ' +
          (demo_zabbix_config.hypervisor.port | string) + ' -W ' + demo_zabbix_guest_ip + ':22 ' +
          demo_zabbix_config.hypervisor.user + '@' + demo_zabbix_config.hypervisor.address) | quote }}
  no_log: true

- name: Wait for the prepared non-root guest management connection
  ansible.builtin.wait_for_connection:
    timeout: 300
  delegate_to: "{{ demo_zabbix_config.hostname }}"
  become: false

- name: Verify fresh guest machine identity over its pinned SSH host key
  ansible.builtin.command:
    argv: [cat, /etc/machine-id]
  register: demo_zabbix_guest_machine_id
  changed_when: false
  delegate_to: "{{ demo_zabbix_config.hostname }}"
  no_log: true

- name: Refuse a missing or hypervisor guest identity
  ansible.builtin.assert:
    that:
      - demo_zabbix_guest_machine_id.stdout | trim is match('^[0-9a-f]{32}$')
      - demo_zabbix_guest_machine_id.stdout | trim != demo_zabbix_config.hypervisor.machine_id
    quiet: true
  no_log: true

- name: Retain complete ownership after authenticated guest identity verification
  ansible.builtin.set_stats:
    data:
      demo_zabbix_instance: >-
        {{ demo_zabbix_config | demo_zabbix_provenance(
             demo_zabbix_guest_record, demo_zabbix_guest_ip, demo_zabbix_network,
             demo_zabbix_guest_machine_id.stdout | trim) }}
    aggregate: false
    per_host: false
  no_log: true
