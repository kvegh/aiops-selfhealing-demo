---
# The execution-time guard matters: looped includes are queued before facts change.
- name: Observe this authoritative round only while publication is unfinished
  when:
    - not (demo_public_dns_authority_ready | bool)
    - now(utc=true).timestamp() < demo_public_dns_authority_deadline
  block:
    - name: Query every literal authoritative IPv4 without recursion
      ansible.builtin.command:
        argv: [dig, -r, -4, '@{{ item.address }}', '{{ demo_public_dns_config.hostname }}.', A, +norecurse, +time=3, +tries=1, +noall, +comments, +question, +answer, +stats]
      loop: '{{ demo_public_dns_authority_endpoints }}'
      when: now(utc=true).timestamp() < demo_public_dns_authority_deadline
      become: false
      changed_when: false
      failed_when: false
      timeout: 8
      register: demo_public_dns_authority_answers
      no_log: false

    - name: Evaluate all authority responses from this round together
      ansible.builtin.set_fact:
        demo_public_dns_authority_observation: >-
          {{ demo_public_dns_authority_answers.results | godaddy_v3_dns_authority_round(
             demo_public_dns_authority_endpoints,
             demo_public_dns_config.hostname,
             demo_public_dns_config.hypervisor.public_ipv4) }}
      no_log: false

    - name: Retain whether this complete round proved every authority ready
      ansible.builtin.set_fact:
        demo_public_dns_authority_ready: '{{ demo_public_dns_authority_observation.ready }}'
      no_log: false

    - name: Wait only between unsuccessful rounds while the budget remains
      ansible.builtin.pause:
        seconds: '{{ [demo_public_dns_authority_poll_delay | default(5), (demo_public_dns_authority_deadline - now(utc=true).timestamp()) | int] | min }}'
      when:
        - not (demo_public_dns_authority_ready | bool)
        - demo_public_dns_authority_round_number < (demo_public_dns_authority_max_rounds | default(180))
        - now(utc=true).timestamp() < demo_public_dns_authority_deadline
        - demo_public_dns_authority_poll_delay | default(5) > 0
      no_log: false
