---
- name: Read the selected agent ping without changing the guest
  ansible.builtin.command:
    argv: [/usr/bin/zabbix_get, -s, "{{ demo_zabbix_config.testserver.address }}", -k, agent.ping]
  register: demo_zabbix_testserver_agent_ping
  changed_when: false
  failed_when: demo_zabbix_testserver_agent_ping.stdout | trim != '1'

- name: Read the selected agent hostname without executing remote commands
  ansible.builtin.command:
    argv: [/usr/bin/zabbix_get, -s, "{{ demo_zabbix_config.testserver.address }}", -k, system.hostname]
  register: demo_zabbix_testserver_agent_hostname
  changed_when: false
  failed_when: >-
    demo_zabbix_testserver_agent_hostname.stdout | trim not in
    [demo_zabbix_config.testserver.vm_name, demo_zabbix_config.testserver.vm_name + '.' + demo_zabbix_config.zone]

- name: Verify the copied Apache checks are inapplicable to this minimal guest
  ansible.builtin.command:
    argv: [/usr/bin/zabbix_get, -s, "{{ demo_zabbix_config.testserver.address }}", -k, 'vfs.file.exists[/usr/sbin/httpd]']
  register: demo_zabbix_testserver_httpd
  changed_when: false
  failed_when: demo_zabbix_testserver_httpd.stdout | trim != '0'
