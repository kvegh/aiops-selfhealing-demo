---
- name: Require one pinned public MCP build recipe
  ansible.builtin.assert:
    that:
      - demo_mcp_image is mapping
      - demo_mcp_image.name is string
      - >-
        demo_mcp_image.repository in
        ['https://github.com/rhel-lightspeed/linux-mcp-server.git', 'https://github.com/initMAX/zabbix-mcp-server.git']
      - demo_mcp_image.revision is match('^[0-9a-f]{40}$')
      - demo_mcp_image.containerfile in ['Containerfile', 'Dockerfile']
    fail_msg: Select the public MCP source recipe with an immutable Git revision.
    quiet: true

- name: Prepare the selected TRA's RHEL subscription before installing packages
  ansible.builtin.include_tasks: demo_mcp_subscription.yml

- name: Install the rootless runtime and Git from the configured trusted RHEL repositories
  ansible.builtin.dnf:
    name: [podman, git, fuse-overlayfs, slirp4netns]
    state: present
    disable_gpg_check: false
    install_weak_deps: false

- name: Read existing subordinate user and group ID allocations
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: demo_mcp_subordinate_ids
  no_log: true

- name: Require existing rootless user namespace allocations
  ansible.builtin.assert:
    that: >-
      item.content | b64decode | demo_mcp_subordinate_range(demo_mcp_user)
    fail_msg: Prepare an approved subordinate user/group range for the existing runtime account first.
    quiet: true
  loop: "{{ demo_mcp_subordinate_ids.results }}"
  no_log: true

- name: Keep the runtime user's container-store parent directories writable by that user
  ansible.builtin.file:
    path: "{{ demo_mcp_user.home }}/{{ item }}"
    state: directory
    owner: "{{ demo_mcp_user.name }}"
    group: "{{ demo_mcp_user.gid }}"
    mode: '0700'
  loop: [.local, .local/share]

- name: Inspect the existing rootless image's source revision without pulling
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ demo_mcp_image.name }}"
      - --format
      - '{% raw %}{{ index .Labels "org.opencontainers.image.revision" }}{% endraw %}'
  become: true
  become_user: "{{ demo_mcp_user.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ demo_mcp_user.uid }}"
  register: demo_mcp_existing_image
  changed_when: false
  failed_when: false

- name: Build only when this source revision is absent from the selected user's image store
  when: >-
    demo_mcp_existing_image.rc != 0 or
    demo_mcp_existing_image.stdout | trim != demo_mcp_image.revision
  become: true
  become_user: "{{ demo_mcp_user.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ demo_mcp_user.uid }}"
  block:
    - name: Start this build without reusing another MCP play's temporary workspace
      ansible.builtin.set_fact:
        demo_mcp_build_workspace: {}

    - name: Check free space before fetching source and building container layers
      ansible.builtin.command:
        argv: [df, -Pk, "{{ demo_mcp_user.home }}"]
      register: demo_mcp_disk_space
      changed_when: false

    - name: Require basic free-space headroom for the source build
      ansible.builtin.assert:
        that: (demo_mcp_disk_space.stdout_lines[-1].split()[3] | int) * 1024 >= 4 * 1024 ** 3
        fail_msg: At least four GiB free space is required before building the MCP image.
        quiet: true

    - name: Allocate a private temporary build workspace for public source only
      ansible.builtin.tempfile:
        state: directory
        path: "{{ demo_mcp_user.home }}"
        prefix: .aiops-mcp-build-
      register: demo_mcp_build_workspace

    - name: Check out the exact public source revision without credentials
      ansible.builtin.git:
        repo: "{{ demo_mcp_image.repository }}"
        version: "{{ demo_mcp_image.revision }}"
        dest: "{{ demo_mcp_build_workspace.path }}/source"
        recursive: false
      register: demo_mcp_source_checkout

    - name: Require the checked-out commit to equal the selected source revision
      ansible.builtin.assert:
        that: demo_mcp_source_checkout.after == demo_mcp_image.revision
        fail_msg: The MCP source checkout did not return the pinned commit.
        quiet: true

    - name: Label only this temporary public source tree for enforcing SELinux container access
      ansible.builtin.file:
        path: "{{ demo_mcp_build_workspace.path }}/source"
        state: directory
        recurse: true
        follow: false
        setype: container_file_t
      become: true
      become_user: root

    - name: Inspect the upstream build recipe without following a link
      ansible.builtin.stat:
        path: "{{ demo_mcp_build_workspace.path }}/source/{{ demo_mcp_image.containerfile }}"
        follow: false
      register: demo_mcp_build_recipe

    - name: Require the pinned source's regular container recipe
      ansible.builtin.assert:
        that:
          - demo_mcp_build_recipe.stat.isreg | default(false)
          - not demo_mcp_build_recipe.stat.islnk | default(false)
        fail_msg: The pinned source has no regular MCP container recipe.
        quiet: true

    # The installed certified Podman role has no public image-build interface.
    # Native gap and verification: ../../docs/10-mcp-deployment.md#target-side-image-builds
    - name: Retain failed container build output privately without weakening protected logging
      vars:
        demo_mcp_build_log_dir: >-
          {{ demo_mcp_user.home }}/.local/share/{{
             {'linux-mcp': 'linux-mcp-server', 'zabbix': 'zabbix-mcp-server'}[demo_mcp_server_name] }}/logs
      block:
        - name: Build the MCP image as the existing runtime user from public source only
          ansible.builtin.command:
            # The pinned Linux recipe explicitly supports dependency wheels.
            argv: >-
              {{ ['podman', 'build'] +
                 (['--build-arg', 'BUILD_FROM_SOURCE=0'] if demo_mcp_server_name == 'linux-mcp' else []) +
                 ['--file', demo_mcp_build_workspace.path ~ '/source/' ~ demo_mcp_image.containerfile,
                  '--tag', demo_mcp_image.name,
                  '--label', 'org.opencontainers.image.revision=' ~ demo_mcp_image.revision,
                  demo_mcp_build_workspace.path ~ '/source'] }}
          register: demo_mcp_build_result
          changed_when: true
          no_log: true

      rescue:
        - name: Prepare only this runtime user's private server log directory
          ansible.builtin.file:
            path: "{{ demo_mcp_build_log_dir }}"
            state: directory
            mode: '0700'

        - name: Save only the failed build's standard output and standard error
          ansible.builtin.copy:
            dest: "{{ demo_mcp_build_log_dir }}/build.log"
            content: "{{ demo_mcp_build_result.stdout | default('') }}\n{{ demo_mcp_build_result.stderr | default('') }}\n"
            mode: '0600'
          diff: false
          no_log: true

        - name: Stop after preserving the failed container build's protected output
          ansible.builtin.fail:
            msg: MCP container build failed; inspect build.log in the runtime user's private server log directory before retrying.

  always:
    - name: Remove only this job's temporary public build workspace
      ansible.builtin.file:
        path: "{{ demo_mcp_build_workspace.path }}"
        state: absent
      when: demo_mcp_build_workspace.path is defined

- name: Verify the image was built from the selected source revision
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ demo_mcp_image.name }}"
      - --format
      - '{% raw %}{{ index .Labels "org.opencontainers.image.revision" }}{% endraw %}'
  become: true
  become_user: "{{ demo_mcp_user.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ demo_mcp_user.uid }}"
  register: demo_mcp_built_image
  changed_when: false
  failed_when: >-
    demo_mcp_built_image.rc != 0 or
    demo_mcp_built_image.stdout | trim != demo_mcp_image.revision
