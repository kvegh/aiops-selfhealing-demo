---
- name: Resolve the same workspace used by the existing Claude job
  ansible.builtin.set_fact:
    demo_mcp_workspace: "{{ demo_mcp_user | demo_mcp_workspace(claude_agent_workdir | default('')) }}"
  no_log: true

- name: Inspect every existing workspace component without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ demo_mcp_workspace.directories }}"
  register: demo_mcp_workspace_components
  no_log: true

- name: Refuse links and unrelated directory ownership before any workspace write
  ansible.builtin.assert:
    that: demo_mcp_workspace_components.results | demo_mcp_safe_directories(demo_mcp_user.uid)
    quiet: true
  no_log: true

- name: Create only missing private workspace directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ demo_mcp_user.name }}"
    group: "{{ demo_mcp_user.gid }}"
    mode: '0700'
    follow: false
  loop: "{{ demo_mcp_workspace_components.results }}"
  when: not item.stat.exists
  no_log: true
