---
- name: Read back every reconciled host and check after frontend validation
  ansible.builtin.include_tasks: demo_zabbix_snapshot.yml

- name: Require all current copied names and endpoints to match this deployment
  ansible.builtin.assert:
    that: >-
      demo_zabbix_config | demo_zabbix_reconciliation(demo_zabbix_reconcile_snapshot,
        demo_zabbix_enable_testserver_monitoring | default(false) | bool) | length == 0
    quiet: true

- name: Verify reviewed testserver monitoring and fresh actual metric samples
  when: demo_zabbix_enable_testserver_monitoring | default(false) | bool
  block:
    - name: Read back every selected check and its template ownership
      ansible.builtin.include_tasks: demo_zabbix_testserver_snapshot.yml

    - name: Require unchanged selected check states after starting monitoring
      ansible.builtin.assert:
        that: (demo_zabbix_config | demo_zabbix_testserver_plan(demo_zabbix_testserver_snapshot)).operations | length == 0
        quiet: true

    - name: Wait for fresh agent ping, uptime and ICMP samples from the selected guest
      ansible.builtin.uri:
        url: http://127.0.0.1/api_jsonrpc.php
        method: POST
        headers:
          Authorization: "Bearer {{ demo_zabbix_clone_api_token }}"
          Content-Type: application/json-rpc
        body_format: json
        body:
          jsonrpc: '2.0'
          method: history.get
          params:
            history: 3
            itemids: "{{ demo_zabbix_testserver_plan.health_items.values() | list }}"
            time_from: "{{ demo_zabbix_testserver_polling_started.stdout | int }}"
            output: [itemid, clock, value]
            sortfield: clock
            sortorder: DESC
            limit: 30
          id: 1
        follow_redirects: none
        validate_certs: true
        status_code: 200
      register: demo_zabbix_testserver_health_samples
      changed_when: false
      until: >-
        demo_zabbix_testserver_health_samples.json.result | default([]) |
        demo_zabbix_testserver_samples_ready(demo_zabbix_testserver_plan.health_items,
          demo_zabbix_testserver_polling_started.stdout | int)
      retries: 30
      delay: 5
      no_log: true

- name: Mark the earliest valid website sample for this readiness check
  ansible.builtin.command:
    argv: [date, '+%s']
  register: demo_zabbix_website_polling_started
  changed_when: false

- name: Wait for a fresh successful website sample from the selected Zabbix server
  ansible.builtin.uri:
    url: http://127.0.0.1/api_jsonrpc.php
    method: POST
    headers:
      Authorization: "Bearer {{ demo_zabbix_clone_api_token }}"
      Content-Type: application/json-rpc
    body_format: json
    body:
      jsonrpc: '2.0'
      method: item.get
      params:
        itemids: ["{{ demo_zabbix_monitoring_item_id }}"]
        output: [itemid, state, lastvalue, lastclock]
      id: 1
    follow_redirects: none
    validate_certs: true
    status_code: 200
  register: demo_zabbix_website_health_sample
  changed_when: false
  until: >-
    (demo_zabbix_website_health_sample.json.result | default([]) | length == 1) and
    (demo_zabbix_website_health_sample.json.result[0].state | string == '0') and
    (demo_zabbix_website_health_sample.json.result[0].lastvalue | string == '200') and
    (demo_zabbix_website_health_sample.json.result[0].lastclock | int >=
      demo_zabbix_website_polling_started.stdout | int)
  retries: 30
  delay: 5
  no_log: true

- name: Read back the selected forwarding script and authentication parameters
  ansible.builtin.include_tasks: demo_zabbix_rpc.yml
  vars:
    demo_zabbix_rpc_method: mediatype.get
    demo_zabbix_rpc_params:
      mediatypeids: ["{{ demo_zabbix_media_id }}"]
      output: extend
      selectParameters: extend

- name: Retain the selected media readback
  ansible.builtin.set_fact:
    demo_zabbix_final_media: "{{ demo_zabbix_rpc_response.json.result }}"

- name: Read back all action states and selected problem and recovery targets
  ansible.builtin.include_tasks: demo_zabbix_rpc.yml
  vars:
    demo_zabbix_rpc_method: action.get
    demo_zabbix_rpc_params:
      output: [actionid, status]
      selectFilter: extend
      selectOperations: extend
      selectRecoveryOperations: extend

- name: Retain action readbacks before the final enable step
  ansible.builtin.set_fact:
    demo_zabbix_final_actions: "{{ demo_zabbix_rpc_response.json.result }}"

- name: Read back the existing recipient associations
  ansible.builtin.include_tasks: demo_zabbix_rpc.yml
  vars:
    demo_zabbix_rpc_method: user.get
    demo_zabbix_rpc_params:
      userids: ['1']
      output: [userid]
      selectMedias: extend

- name: Require exact current delivery settings with no stale recipient destination
  ansible.builtin.assert:
    that: >-
      demo_zabbix_final_media | demo_zabbix_delivery_ready(
        demo_zabbix_final_actions, demo_zabbix_rpc_response.json.result,
        demo_zabbix_media_definition, demo_zabbix_media_id, demo_zabbix_action_id,
        demo_zabbix_monitoring_trigger_id, demo_zabbix_delivery.url, demo_zabbix_stale_media_ids)
    quiet: true

- name: Require exact agent delivery through the same current event stream
  ansible.builtin.assert:
    that: >-
      demo_zabbix_final_media | demo_zabbix_delivery_ready(
        demo_zabbix_final_actions, demo_zabbix_rpc_response.json.result,
        demo_zabbix_media_definition, demo_zabbix_media_id, demo_zabbix_agent_action_id,
        demo_zabbix_agent_trigger_id, demo_zabbix_delivery.url, demo_zabbix_stale_media_ids)
    quiet: true
  when: demo_zabbix_enable_testserver_monitoring | default(false) | bool

- name: Retain only the verified deployment forwarding actions
  ansible.builtin.set_fact:
    demo_zabbix_forwarding_action_ids: >-
      {{ [demo_zabbix_action_id] +
         ([demo_zabbix_agent_action_id] if demo_zabbix_enable_testserver_monitoring | default(false) | bool else []) }}

- name: Enable only verified deployment forwarding actions as the final configuration writes
  ansible.builtin.include_tasks: demo_zabbix_rpc.yml
  vars:
    demo_zabbix_rpc_method: action.update
    demo_zabbix_rpc_params:
      actionid: "{{ demo_zabbix_forwarding_action_id }}"
      status: 0
  loop: "{{ demo_zabbix_forwarding_action_ids }}"
  loop_control:
    loop_var: demo_zabbix_forwarding_action_id
  when: demo_zabbix_enable_delivery | default(false) | bool

- name: Read back the final selected action states
  ansible.builtin.include_tasks: demo_zabbix_rpc.yml
  vars:
    demo_zabbix_rpc_method: action.get
    demo_zabbix_rpc_params:
      actionids: "{{ demo_zabbix_forwarding_action_ids }}"
      output: [actionid, status]

- name: Verify the requested final forwarding state
  ansible.builtin.assert:
    that:
      - demo_zabbix_rpc_response.json.result | length == demo_zabbix_forwarding_action_ids | length
      - >-
        demo_zabbix_rpc_response.json.result | map(attribute='status') | map('int') | unique | list
        == [0 if demo_zabbix_enable_delivery | default(false) | bool else 1]
    quiet: true
