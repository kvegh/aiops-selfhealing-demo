---
- name: Prepare the existing runtime user's client workspace
  ansible.builtin.file:
    path: "{{ demo_mcp_user.home }}/claude-wd"
    state: directory
    owner: "{{ demo_mcp_user.name }}"
    group: "{{ demo_mcp_user.gid }}"
    mode: '0700'

- name: Inspect the existing Claude client configuration
  ansible.builtin.stat:
    path: "{{ demo_mcp_user.home }}/.claude.json"
  register: demo_mcp_client_stat

- name: Read and preserve existing client configuration
  ansible.builtin.slurp:
    src: "{{ demo_mcp_user.home }}/.claude.json"
  register: demo_mcp_client_previous
  when: demo_mcp_client_stat.stat.exists
  no_log: true

- name: Add only this MCP entry to the corresponding project configuration
  ansible.builtin.copy:
    content: >-
      {{ (demo_mcp_client_previous.content | default('') | b64decode) |
          demo_mcp_client_configuration(demo_mcp_user.home + '/claude-wd',
                                       demo_mcp_server_name, demo_mcp_server_definition) | to_nice_json }}
    dest: "{{ demo_mcp_user.home }}/.claude.json"
    owner: "{{ demo_mcp_user.name }}"
    group: "{{ demo_mcp_user.gid }}"
    mode: '0600'
  no_log: true
  diff: false
