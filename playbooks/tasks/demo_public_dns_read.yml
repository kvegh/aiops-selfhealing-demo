---
- name: Require exact selected workload DNS inputs
  ansible.builtin.assert:
    that:
      - demo_public_dns_config | godaddy_v3_selected_config is mapping
      - demo_public_dns_api_token is string
      - demo_public_dns_api_token | length > 0
    quiet: true
  no_log: false

- name: Read the exact reserved name and all conflicting DNS types using v3
  ansible.builtin.uri:
    url: "https://api.godaddy.com/v3/domains/zones/{{ demo_public_dns_config.zone | urlencode }}/dns-records?type={{ item }}&name={{ demo_public_dns_config.record_name | urlencode }}&page=1&pageSize=100&totalRequired=true"
    method: GET
    headers:
      Authorization: "Bearer {{ demo_public_dns_api_token }}"
    status_code: 200
    follow_redirects: none
    validate_certs: true
    timeout: 30
  loop: [A, AAAA, CNAME]
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: demo_public_dns_pages
  no_log: false

- name: Validate complete exact-name pages and retain provider record IDs
  ansible.builtin.set_fact:
    demo_public_dns_existing_a: "{{ demo_public_dns_pages.results[0].json | godaddy_v3_records(demo_public_dns_config.record_name, 'A') }}"
    demo_public_dns_existing_aaaa: "{{ demo_public_dns_pages.results[1].json | godaddy_v3_records(demo_public_dns_config.record_name, 'AAAA') }}"
    demo_public_dns_existing_cname: "{{ demo_public_dns_pages.results[2].json | godaddy_v3_records(demo_public_dns_config.record_name, 'CNAME') }}"
  no_log: false

- name: Refuse conflicting addresses and aliases before changing the reserved hostname
  ansible.builtin.assert:
    that:
      - demo_public_dns_existing_a | length <= 1
      - demo_public_dns_existing_a | demo_website_safe_dns_records(demo_public_dns_config.hypervisor.public_ipv4)
      - demo_public_dns_existing_aaaa | length == 0
      - demo_public_dns_existing_cname | length == 0
    fail_msg: The reserved hostname has a conflicting DNS record; inspect it before continuing.
    quiet: true
  no_log: false
