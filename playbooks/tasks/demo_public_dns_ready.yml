---
- name: Wait for authoritative publication before any recursive selected-name query
  when: not ansible_check_mode
  block:
    - name: Require the actual exact provider readback before selected-name DNS queries
      ansible.builtin.assert:
        that:
          - demo_public_dns_readback is defined
          - demo_public_dns_readback.status == 200
          - demo_public_dns_readback.json | godaddy_v3_records(demo_public_dns_config.record_name, 'A') | map(attribute='data') | list == [demo_public_dns_config.hypervisor.public_ipv4]
          - demo_public_dns_readback.json | godaddy_v3_records(demo_public_dns_config.record_name, 'A') | map(attribute='ttl') | list == [600]
        quiet: true

    - name: Require finite authoritative observation budgets
      ansible.builtin.assert:
        that:
          - demo_public_dns_authority_timeout | default(900) is integer
          - demo_public_dns_authority_timeout | default(900) >= 1
          - demo_public_dns_authority_timeout | default(900) <= 1800
          - demo_public_dns_authority_max_rounds | default(180) is integer
          - demo_public_dns_authority_max_rounds | default(180) >= 1
          - demo_public_dns_authority_max_rounds | default(180) <= 180
          - demo_public_dns_authority_poll_delay | default(5) is integer
          - demo_public_dns_authority_poll_delay | default(5) >= 0
          - demo_public_dns_authority_poll_delay | default(5) <= 10
        quiet: true

    - name: Read only provider-hosted zone apex nameservers through strict v3 HTTPS
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v3/domains/zones/{{ demo_public_dns_config.zone | urlencode }}/dns-records?type=NS&name=%40&page=1&pageSize=100&totalRequired=true"
        method: GET
        headers:
          Authorization: "Bearer {{ demo_public_dns_api_token }}"
        status_code: 200
        validate_certs: true
        follow_redirects: none
        timeout: 30
      delegate_to: localhost
      become: false
      changed_when: false
      register: demo_public_dns_provider_nameservers
      no_log: false

    - name: Discover public nameservers for the existing zone apex only
      ansible.builtin.command:
        argv: [dig, -r, -4, '@8.8.8.8', '{{ demo_public_dns_config.zone }}.', NS, +time=3, +tries=1, +noall, +comments, +question, +answer, +stats]
      become: false
      changed_when: false
      timeout: 8
      register: demo_public_dns_public_nameservers
      no_log: false

    - name: Require the provider and public zone-apex nameserver sets to agree
      ansible.builtin.set_fact:
        demo_public_dns_authority_nameservers: >-
          {{ demo_public_dns_provider_nameservers.json | godaddy_v3_records('@', 'NS') |
             godaddy_v3_dns_nameservers(demo_public_dns_public_nameservers, demo_public_dns_config.zone) }}
      no_log: false

    - name: Resolve only approved nameserver hostnames to IPv4 endpoints
      ansible.builtin.command:
        argv: [dig, -r, -4, '@8.8.8.8', '{{ item }}.', A, +time=3, +tries=1, +noall, +comments, +question, +answer, +stats]
      loop: '{{ demo_public_dns_authority_nameservers }}'
      become: false
      changed_when: false
      timeout: 8
      register: demo_public_dns_nameserver_addresses
      no_log: false

    - name: Retain every approved IPv4 endpoint and initialize this finite observation
      ansible.builtin.set_fact:
        demo_public_dns_authority_endpoints: '{{ demo_public_dns_nameserver_addresses.results | godaddy_v3_dns_endpoints(demo_public_dns_authority_nameservers) }}'
        demo_public_dns_authority_ready: false
        demo_public_dns_authority_observation: {}
        demo_public_dns_authority_deadline: '{{ now(utc=true).timestamp() + (demo_public_dns_authority_timeout | default(900)) }}'
      no_log: false

    - name: Observe bounded rounds until every selected authority returns the exact A binding
      ansible.builtin.include_tasks: demo_public_dns_ready_round.yml
      loop: '{{ range(1, (demo_public_dns_authority_max_rounds | default(180)) + 1) | list }}'
      loop_control:
        loop_var: demo_public_dns_authority_round_number
      no_log: false

    - name: Require authoritative publication before the existing recursive DNS gate
      ansible.builtin.assert:
        that: demo_public_dns_authority_ready | bool
        fail_msg: Authoritative DNS did not publish the exact selected binding within the finite observation budget; no recursive selected-name query was made.
        quiet: true
      no_log: false
