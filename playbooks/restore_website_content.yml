---
# Restores the demo corporate website after the fault.
#
# This is the approved remediation the agent selects from the catalog once
# it has diagnosed the missing content file. It is deliberately written to
# restore *service*, not merely to undo the specific fault: if the aside
# copy is gone too, it redeploys from the project rather than giving up.
# A remediation that only works against one exact failure shape is not
# much of a remediation.

- name: Restore the demo website content
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../myvars"

  vars:
    demo_website_check_hostname: "{{ demo_website_public_hostname | default(vault_demo_website_public_hostname) }}"
    demo_website_root: /var/www/redhat
    # Staged on the target by "Enable Demo Website", which is the only play
    # that talks to git. This one is on the healing path, so it copies from
    # the existing checkout — a clone here would add latency to every
    # recovery for content that has not changed since the demo was enabled.
    demo_web_checkout: /opt/demo-web-src

  pre_tasks:
    - name: Select and verify the website's hypervisor before connecting
      ansible.builtin.include_tasks: tasks/demo_website_target.yml

  tasks:
    - name: Look for the content file and the aside copy
      ansible.builtin.stat:
        path: "{{ demo_website_root }}/{{ item }}"
      loop:
        - content.html
        - content.html.disabled
      register: demo_files
      loop_control:
        label: "{{ item }}"

    - name: Note what is present
      ansible.builtin.set_fact:
        content_present: "{{ demo_files.results[0].stat.exists }}"
        aside_present: "{{ demo_files.results[1].stat.exists }}"

    - name: Move the aside copy back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ demo_website_root }}/content.html.disabled"
          - "{{ demo_website_root }}/content.html"
      when:
        - not content_present
        - aside_present
      changed_when: true

    - name: Redeploy from the staged checkout when the aside copy is gone too
      when:
        - not content_present
        - not aside_present
      block:

        - name: Confirm the staged checkout is present
          ansible.builtin.stat:
            path: "{{ demo_web_checkout }}/demo-web/content.html"
          register: demo_staged

        - name: Fail clearly if the demo was never enabled on this host
          ansible.builtin.assert:
            that: demo_staged.stat.exists
            fail_msg: >-
              Neither content.html, its aside copy, nor the staged checkout at
              {{ demo_web_checkout }} exists. Run "Enable Demo Website" to
              stage the content before this can restore it.
            quiet: true

        - name: Copy the page back from the staged checkout
          ansible.builtin.copy:
            src: "{{ demo_web_checkout }}/demo-web/content.html"
            remote_src: true
            dest: "{{ demo_website_root }}/content.html"
            owner: root
            group: root
            mode: "0644"
            setype: httpd_sys_content_t

    - name: Confirm nginx serves the page again
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o/dev/null
          - -w%{http_code}
          # Resolved to the loopback on purpose: the public name points at
          # this host's external address, which it cannot reach from here
          # (no NAT hairpin).
          - --resolve
          - "{{ demo_website_check_hostname }}:443:127.0.0.1"
          - https://{{ demo_website_check_hostname }}/content.html
      register: demo_check
      changed_when: false
      failed_when: demo_check.stdout != "200"
      retries: 3
      delay: 2
      until: demo_check is succeeded

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Website content restored
          ({{ 'was already present' if content_present
              else 'moved back from the aside copy' if aside_present
              else 'redeployed from the project' }});
          /content.html returns {{ demo_check.stdout }}.
