---
# Switches the demo corporate website on before a session and off afterwards.
#
#   demo_website_state=enabled    serve the button page
#   demo_website_state=disabled   serve the inert placeholder
#
# Intended as two AAP job templates over one playbook ("Enable Demo Website"
# / "Disable Demo Website"), each pinning the state as an extra variable.
#
# Runs against the hypervisor, where nginx serves the site directly from
# demo_website_root. The vhost, certificate and firewall are not managed
# here — they are part of the host's own configuration. This playbook only
# owns the content.
#
# Disabling swaps the page rather than removing the site, so the URL keeps
# answering 200. A deleted site looks broken to anyone holding the link and
# would trip HTTP monitoring every time the demo was put away.
#
# nginx needs no special configuration for the fault to work: a request for
# a file that is not there is a 404 by default. That is the whole trick —
# the outage the audience sees is a real web server returning a real 404.

- name: Switch the demo corporate website on or off
  hosts: all
  become: true

  vars:
    demo_website_root: /var/www/redhat

  tasks:
    # No default on purpose — a play-level var would outrank the inventory
    # and silently shadow whatever AAP supplies.
    - name: Require an explicit state
      ansible.builtin.assert:
        that:
          - demo_website_state is defined
          - demo_website_state in ['enabled', 'disabled']
        fail_msg: >-
          demo_website_state must be 'enabled' or 'disabled'. Supply it from
          the job template or -e demo_website_state=... on the CLI.
        quiet: true

    - name: Ensure the site directory exists
      ansible.builtin.file:
        path: "{{ demo_website_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
        # Explicit rather than inherited: a file moved into place can carry
        # the wrong context, and a mislabelled site fails as a 403, which
        # looks nothing like the fault we are demonstrating.
        setype: httpd_sys_content_t

    - name: Enable the demo
      when: demo_website_state == 'enabled'
      block:

        - name: Deploy the shell and the button page
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../demo-web/{{ item }}"
            dest: "{{ demo_website_root }}/{{ item }}"
            owner: root
            group: root
            mode: "0644"
            setype: httpd_sys_content_t
          loop:
            - index.html
            - content.html

    - name: Disable the demo
      when: demo_website_state == 'disabled'
      block:

        - name: Serve the placeholder as the index
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../demo-web/disabled.html"
            dest: "{{ demo_website_root }}/index.html"
            owner: root
            group: root
            mode: "0644"
            setype: httpd_sys_content_t

        # content.html going away is what the placeholder is for: no shell
        # left polling for it, so nothing renders a 404 at a visitor. The
        # .disabled copy is the fault-injection artefact — clearing it means
        # putting the demo away mid-incident still leaves things clean.
        - name: Remove the button page and any fault-injection copy
          ansible.builtin.file:
            path: "{{ demo_website_root }}/{{ item }}"
            state: absent
          loop:
            - content.html
            - content.html.disabled

    - name: Confirm the expected page is served
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o/dev/null
          - -w%{http_code}
          # Resolved to the loopback on purpose: the public name points at
          # this host's external address, which it cannot reach from here
          # (no NAT hairpin).
          - --resolve
          - redhat.supercorp.at:443:127.0.0.1
          - "https://redhat.supercorp.at/{{ 'content.html' if demo_website_state == 'enabled' else 'index.html' }}"
      register: demo_check
      changed_when: false
      failed_when: demo_check.stdout != "200"
      retries: 3
      delay: 2
      until: demo_check is succeeded

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Demo website {{ demo_website_state }}.
          {{ 'Shell at /, fault target /content.html.'
             if demo_website_state == 'enabled'
             else 'Placeholder served at / — disable the Zabbix web scenario too.' }}
