---
# Switches the demo corporate website on before a session and off afterwards.
#
#   demo_website_state=enabled    serve the button page
#   demo_website_state=disabled   serve the inert placeholder
#
# Intended as two AAP job templates over one playbook ("Enable Demo Website"
# / "Disable Demo Website"), each pinning the state as an extra variable.
#
# Runs against the hypervisor, where nginx serves the site directly from
# demo_website_root. Explicitly managed versioned deployments also provision
# their DNS, certificate and isolated vhost using the existing AAP allocation.
#
# Disabling swaps the page rather than removing the site, so the URL keeps
# answering 200. A deleted site looks broken to anyone holding the link and
# would trip HTTP monitoring every time the demo was put away.
#
# nginx needs no special configuration for the fault to work: a request for
# a file that is not there is a 404 by default. That is the whole trick —
# the outage the audience sees is a real web server returning a real 404.

- name: Switch the demo corporate website on or off
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../myvars"

  vars:
    demo_website_check_hostname: "{{ demo_website_public_hostname | default(vault_demo_website_public_hostname) }}"
    demo_website_root: /var/www/redhat
    demo_button_marker: /var/www/redhat/.armed
    demo_website_rate_limit_file: /etc/nginx/demo-website-rate-limit.conf
    # Page content is checked out on the target rather than copied out of the
    # AAP project directory. The project checkout is the controller's working
    # copy, not a distribution channel — reaching into it couples the play to
    # how AAP happens to lay out its private data. Public repo, so the clone
    # needs no credential.
    demo_web_repo: https://github.com/kvegh/aiops-selfhealing-demo.git
    demo_web_version: main
    demo_web_checkout: /opt/demo-web-src
    # The nginx-444 jail bans any address that hits the box with an unknown
    # Host header twice in 10 minutes, for an hour. An audience member who
    # types the IP instead of the hostname would trip it — and because the
    # room shares one NAT address, that bans everyone. Stopped for the demo,
    # restored afterwards. Stopping also drops the jail's existing bans.
    demo_website_fail2ban_jail: nginx-444

  pre_tasks:
    - name: Load the selected instance's protected settings before managed website changes
      ansible.builtin.include_tasks: tasks/demo_runtime_settings.yml
      vars:
        demo_runtime_expected_instance: "{{ demo_website_deployment.instance_name }}"
      when:
        - demo_website_manage_infrastructure | default(false) | bool
        - demo_website_state | default('') == 'enabled'

    - name: Select and verify the website's hypervisor before connecting
      ansible.builtin.include_tasks: tasks/demo_website_target.yml

  tasks:
    # No default on purpose — a play-level var would outrank the inventory
    # and silently shadow whatever AAP supplies.
    - name: Require an explicit state
      ansible.builtin.assert:
        that:
          - demo_website_state is defined
          - demo_website_state in ['enabled', 'disabled']
        fail_msg: >-
          demo_website_state must be 'enabled' or 'disabled'. Supply it from
          the job template or -e demo_website_state=... on the CLI.
        quiet: true

    - name: Prepare this version's DNS, trusted HTTPS and nginx configuration
      ansible.builtin.include_tasks: tasks/demo_website_infrastructure.yml
      when:
        - demo_website_manage_infrastructure | default(false) | bool
        - demo_website_state == 'enabled'

    - name: Disarm the button during the lifecycle transition
      ansible.builtin.file:
        path: "{{ demo_button_marker }}"
        state: absent

    - name: Ensure git is available for the content checkout
      ansible.builtin.package:
        name: git
        state: present
      when: not (demo_website_manage_infrastructure | default(false) | bool)

    # force: true so a hand-edit on the host is discarded rather than
    # failing the clone — the repo is the only source of truth for content.
    - name: Check out the page content on the target
      ansible.builtin.git:
        repo: "{{ demo_web_repo }}"
        dest: "{{ demo_web_checkout }}"
        version: "{{ demo_web_version }}"
        force: true
      register: demo_web_clone

    - name: Report the checked-out revision
      ansible.builtin.debug:
        msg: "Serving content from {{ demo_web_version }} at {{ demo_web_clone.after | default('unknown') }}"

    - name: Pause monitoring before changing the website
      ansible.builtin.include_tasks: tasks/demo_website_monitoring.yml
      vars:
        demo_monitoring_step: before
      when: demo_website_manage_monitoring | default(true) | bool

    # The dedicated vhost includes this file in its button location.
    # All other locations already have no limits. Emptying the include
    # therefore removes rate limiting for the whole demo site.
    - name: Set the demo site's rate limiting for this session
      ansible.builtin.include_tasks: tasks/demo_website_rate_limit.yml

    - name: Ensure the site directory exists
      ansible.builtin.file:
        path: "{{ demo_website_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
        # Explicit rather than inherited: a file moved into place can carry
        # the wrong context, and a mislabelled site fails as a 403, which
        # looks nothing like the fault we are demonstrating.
        setype: httpd_sys_content_t

    - name: Look for fail2ban
      ansible.builtin.stat:
        path: /usr/bin/fail2ban-client
      register: demo_f2b_bin
      when: demo_website_manage_fail2ban | default(true) | bool

    - name: Check whether the jail is currently running
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ demo_website_fail2ban_jail }}"
      register: demo_f2b_status
      changed_when: false
      # Non-zero simply means "not running"; that is information, not failure.
      failed_when: false
      when:
        - demo_website_manage_fail2ban | default(true) | bool
        - demo_f2b_bin.stat.exists | default(false)

    - name: Enable the demo
      when: demo_website_state == 'enabled'
      block:

        - name: Deploy the shell and the button page
          ansible.builtin.copy:
            src: "{{ demo_web_checkout }}/demo-web/{{ item }}"
            remote_src: true
            dest: "{{ demo_website_root }}/{{ item }}"
            owner: root
            group: root
            mode: "0644"
            setype: httpd_sys_content_t
          loop:
            - index.html
            - content.html

    - name: Disable the demo
      when: demo_website_state == 'disabled'
      block:

        - name: Serve the placeholder as the index
          ansible.builtin.copy:
            src: "{{ demo_web_checkout }}/demo-web/disabled.html"
            remote_src: true
            dest: "{{ demo_website_root }}/index.html"
            owner: root
            group: root
            mode: "0644"
            setype: httpd_sys_content_t

        # content.html going away is what the placeholder is for: no shell
        # left polling for it, so nothing renders a 404 at a visitor. The
        # .disabled copy is the fault-injection artefact — clearing it means
        # putting the demo away mid-incident still leaves things clean.
        - name: Remove the button page and any fault-injection copy
          ansible.builtin.file:
            path: "{{ demo_website_root }}/{{ item }}"
            state: absent
          loop:
            - content.html
            - content.html.disabled
            - .armed

    # Deliberately after the content tasks: a fail2ban problem must not stop
    # the site being put into the state that was asked for.
    - name: Stop the jail for the duration of the demo
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - stop
          - "{{ demo_website_fail2ban_jail }}"
      when:
        - demo_website_state == 'enabled'
        - demo_website_manage_fail2ban | default(true) | bool
        - demo_f2b_bin.stat.exists | default(false)
        - demo_f2b_status.rc | default(1) == 0
      changed_when: true

    # `stop` removes the jail outright, so `start` cannot bring it back
    # ("the jail does not exist"). A reload re-reads the configuration and
    # recreates every enabled jail, which is the only reliable way back.
    # It is a no-op for the jails that are already running.
    - name: Restore the jail after the demo
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - reload
      when:
        - demo_website_state == 'disabled'
        - demo_website_manage_fail2ban | default(true) | bool
        - demo_f2b_bin.stat.exists | default(false)
        - demo_f2b_status.rc | default(0) != 0
      changed_when: true

    - name: Confirm the jail is back
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ demo_website_fail2ban_jail }}"
      when:
        - demo_website_state == 'disabled'
        - demo_website_manage_fail2ban | default(true) | bool
        - demo_f2b_bin.stat.exists | default(false)
      changed_when: false
      retries: 3
      delay: 2

    - name: Confirm the expected page is served
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o/dev/null
          - -w%{http_code}
          # Resolved to the loopback on purpose: the public name points at
          # this host's external address, which it cannot reach from here
          # (no NAT hairpin).
          - --resolve
          - "{{ demo_website_check_hostname }}:443:127.0.0.1"
          - "https://{{ demo_website_check_hostname }}/{{ 'content.html' if demo_website_state == 'enabled' else 'index.html' }}"
      register: demo_check
      changed_when: false
      failed_when: demo_check.stdout != "200"
      retries: 3
      delay: 2
      until: demo_check is succeeded

    - name: Resume monitoring after the enabled site is healthy
      ansible.builtin.include_tasks: tasks/demo_website_monitoring.yml
      vars:
        demo_monitoring_step: after
      when:
        - demo_website_state == 'enabled'
        - demo_website_manage_monitoring | default(true) | bool

    # Each arming needs a fresh body for AAP webhook deduplication. Keep the
    # audience disarmed until Zabbix has a fresh 200 and the trigger is on.
    - name: Arm the button after monitoring is ready
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        dest: "{{ demo_button_marker }}"
        owner: root
        group: root
        mode: "0644"
        setype: httpd_sys_content_t
      when:
        - demo_website_state == 'enabled'
        - demo_website_arm_on_enable | default(true) | bool

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Demo website {{ demo_website_state }}.
          {{ 'Shell at /, fault target /content.html.'
             if demo_website_state == 'enabled'
             else 'Placeholder served at /; Zabbix content monitoring disabled.' }}
