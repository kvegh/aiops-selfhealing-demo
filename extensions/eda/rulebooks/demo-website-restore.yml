---
- name: Restore the monitored demo website
  hosts: all
  sources:
    # The activation maps the existing EDA Event Stream over this source.
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Demo website content unavailable - restore content
      condition: event.payload.event_name is search("Demo website content unavailable", ignorecase=true)
      action:
        run_job_template:
          name: "Restore Website Content"
          organization: "Default"
