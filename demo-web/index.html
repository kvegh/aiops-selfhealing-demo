<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Hat | Enterprise Open Source</title>
<!--
  Outer shell. This file is never touched by the demo fault, so it keeps
  polling content.html and every phone in the room flips to the outage and
  back on its own. content.html is the file that actually disappears, and
  it carries its own styling -- the shell only styles the 404 state.
-->
<style>
    /* No webfonts on purpose: every byte is served from this host, so the
       page renders identically on a phone with no internet beyond the venue
       wifi. The system stack is close enough to Red Hat Text in weight and
       proportion that the look survives. */
    :root {
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
                Arial, "Noto Sans", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas,
                "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
        font-family: var(--sans);
        background: #fff;
        color: #151515;
        -webkit-text-size-adjust: 100%;
    }

    #stage.is-gone { display: none; }

    /* ---- the 404 the audience gets when the site goes down -------- */

    #notfound {
        display: none;
        padding: 17vh 24px;
        text-align: center;
        font-family: var(--mono);
    }

    #notfound.is-shown { display: block; }

    #notfound h1 {
        margin: 0 0 10px;
        font-family: var(--sans);
        font-size: clamp(56px, 16vw, 128px);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #151515;
    }

    #notfound .sub {
        margin: 0;
        font-size: clamp(16px, 3.4vw, 21px);
        font-weight: 700;
        letter-spacing: 0.02em;
    }

    /* Sized for a conference projector and for screen-casting in a call:
       this is the state the audience stares at while the platform works,
       so it has to read from the back of the room. */
    #notfound .hr {
        max-width: 1000px;
        margin: 34px auto 0;
        border-top: 2px solid #ee0000;
        padding-top: 26px;
    }

    #notfound .hr p {
        margin: 14px 0;
        font-size: clamp(21px, 3.6vw, 38px);
        line-height: 1.35;
        font-weight: 700;
        color: #ee0000;
    }

    #notfound .hr code {
        font-family: var(--mono);
        font-size: 0.92em;
        word-break: break-all;
    }

    #notfound .server {
        margin-top: 26px;
        font-size: 13px;
        color: #9a9a9a;
    }

    /* Small pulse so a static 404 still looks like something is happening. */
    #notfound .watching {
        display: inline-block;
        margin-top: 30px;
        padding: 14px 30px;
        border: 3px solid #ee0000;
        border-radius: 999px;
        font-size: clamp(19px, 3.2vw, 34px);
        font-weight: 700;
        letter-spacing: 0.03em;
        color: #ee0000;
    }

    #notfound .dot {
        display: inline-block;
        width: 0.5em;
        height: 0.5em;
        margin-right: 0.45em;
        border-radius: 50%;
        background: #ee0000;
        vertical-align: baseline;
        animation: blink 1.3s ease-in-out infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    @media (prefers-reduced-motion: reduce) {
        #notfound .dot { animation: none; }
    }

    /* ---- click feedback ------------------------------------------- */

    #flash {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.86);
        color: #fff;
        font-family: var(--sans);
        font-weight: 900;
        font-size: clamp(22px, 6vw, 40px);
        text-align: center;
        padding: 24px;
        z-index: 10;
    }

    #flash.is-shown { display: grid; }
</style>
</head>
<body>

<main id="stage"></main>

<section id="notfound">
    <h1>404</h1>
    <p class="sub">Not Found</p>
    <div class="hr">
        <p>The requested URL <code>/redhat/content.html</code> was not found on this server.</p>
        <p id="nf-note">&nbsp;</p>
    </div>
    <p class="watching"><span class="dot"></span>Monitoring has been notified</p>
    <p class="server">nginx (Red Hat Enterprise Linux) Server at redhat.supercorp.at Port 443</p>
</section>

<div id="flash"><span id="flash-text"></span></div>

<script>
(function () {
    "use strict";

    var POLL_MS = 2000;

    var stage = document.getElementById("stage");
    var notfound = document.getElementById("notfound");
    var nfNote = document.getElementById("nf-note");
    var flash = document.getElementById("flash");
    var flashText = document.getElementById("flash-text");

    var up = null;                  // null = unknown, true/false once polled
    var clickedThisOutage = false;

    function showFlash(msg, ms) {
        flashText.textContent = msg;
        flash.classList.add("is-shown");
        if (ms) {
            setTimeout(function () { flash.classList.remove("is-shown"); }, ms);
        }
    }

    // Must be re-bound every time content.html is re-injected.
    function bindButton() {
        var btn = document.getElementById("panic-button");
        if (!btn) { return; }

        btn.addEventListener("click", function () {
            if (clickedThisOutage) { return; }
            clickedThisOutage = true;
            btn.disabled = true;

            showFlash("You pushed it.");

            // nginx proxies this to the AAP job template launch endpoint and
            // injects the token, so no credentials ever reach the browser.
            fetch("/api/panic", { method: "POST", cache: "no-store" })
                .then(function (r) {
                    if (!r.ok) { throw new Error("HTTP " + r.status); }
                    showFlash("You pushed it.", 2200);
                })
                .catch(function (err) {
                    clickedThisOutage = false;
                    btn.disabled = false;
                    showFlash("Fault injection failed: " + err.message, 4000);
                });
        });
    }

    function render(state, html) {
        if (state === up) { return; }       // only touch the DOM on a transition
        up = state;

        if (state) {
            stage.innerHTML = html;
            stage.classList.remove("is-gone");
            notfound.classList.remove("is-shown");
            clickedThisOutage = false;      // rearmed once the site is back
            bindButton();
        } else {
            stage.classList.add("is-gone");
            stage.innerHTML = "";
            notfound.classList.add("is-shown");
            nfNote.textContent = "Outage detected at " + new Date().toLocaleTimeString() + ".";
            flash.classList.remove("is-shown");
        }
    }

    function poll() {
        fetch("content.html?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
                if (r.ok) { return r.text().then(function (t) { render(true, t); }); }
                render(false);
            })
            .catch(function () { render(false); });
    }

    poll();
    setInterval(poll, POLL_MS);
}());
</script>

</body>
</html>
