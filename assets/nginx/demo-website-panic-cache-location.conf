# Include only inside the existing exact /api/panic location.
# Keep its arm-marker guard, POST restriction, and private AAP headers.
client_max_body_size 1k;
proxy_request_buffering on;
proxy_buffering on;
proxy_cache demo_panic_deliveries;
proxy_cache_methods POST;
proxy_cache_key "$request_method|$uri|$request_body";
proxy_cache_lock on;
proxy_cache_lock_timeout 30s;
proxy_cache_lock_age 30s;
proxy_cache_valid 202 1h;
# Only the accepted webhook response is cached, despite its no-store header.
# The fixed upstream identity is identical for every audience request.
proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
proxy_hide_header Set-Cookie;
# Tell the page whether its press was the first in this round. Repeat presses
# carry the same nonce and are answered from the cache: HIT means someone else
# already pressed, so the page shows "Someone beat you to it." straight away
# instead of waiting for the fault job to remove the arm marker. Empty values
# (the 423 path) are not sent. A location-level add_header stops server-level
# add_header directives (such as HSTS) applying to /api/panic responses; the
# page itself still receives them.
add_header X-Panic-Delivery $upstream_cache_status always;
proxy_connect_timeout 5s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;
proxy_next_upstream off;
