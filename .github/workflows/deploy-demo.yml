name: Publish AIOps walkthrough

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the walkthrough
        run: |
          node --check demo/src/scenario.js
          node --check demo/src/app.js
          node --check demo/src/presentation.js
          node --test demo/tests/*.test.cjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare only the public walkthrough
        run: |
          mkdir -p "${RUNNER_TEMP}/aiops-demo/src"
          cp demo/index.html demo/icon.svg "${RUNNER_TEMP}/aiops-demo/"
          cp demo/src/scenario.js demo/src/app.js demo/src/presentation.js demo/src/styles.css demo/src/presentation.css "${RUNNER_TEMP}/aiops-demo/src/"
          touch "${RUNNER_TEMP}/aiops-demo/.nojekyll"
      - name: Upload the walkthrough
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/aiops-demo
      # Artifact metadata lagged immediately after successful uploads in two fresh runs.
      # See docs/12-interactive-recovery-walkthrough.md#publish-with-github-pages.
      - name: Allow uploaded artifact metadata to settle
        run: sleep 5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
